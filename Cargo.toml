[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tempfile = "3"
rust_decimal = { version = "1", features = ["maths"] }
yy-accountant = { path = "core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
